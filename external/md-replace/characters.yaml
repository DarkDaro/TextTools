# Реестр персонажей
# имя: текущее имя персонажа
# формы: все формы текущего имени (склонения)
# старое: предыдущие имена — безопасные для авто-замены
# старое_опасное: формы которые совпадают с другими персонажами (только пометка, не авто-замена)
# опечатки: частые ошибки написания

- имя: Эрика
  формы: [Эрика, Эрики, Эрике, Эрику, Эрикой, Эрикою]
  старое: [Лика, Лики, Лике, Лику, Ликой]
  старое_опасное: []
  опечатки: []

- имя: Мастер Кайдзо
  формы: [Мастер Кайдзо, Мастера Кайдзо, Мастеру Кайдзо, Мастером Кайдзо, Мастере Кайдзо, Кайдзо]
  старое: [Мастер Линь, Мастера Линя, Мастеру Линю, Мастером Линем, Мастере Лине, Линь, Линя, Линю, Линем]
  старое_опасное: [Лине]  # совпадает с формой "Лина" (главная героиня)
  опечатки: [Кайзо]
