# ======================================================================
# АНТИРЕШИМОСТЬ — запрещённая лексика романа
# «История Даро. Проект Восход» (мрачный нео-нуар киберпанк: герои
# не побеждают, а выживают; тело — последняя граница свободы).
#
# Формат правила:
#   cat   — категория для отчёта и лога (обязательно)
#   level — hard: убрать (--clean вырезает); soft: только подсветка
#   re    — регэксп Python, регистр не важен, писать в нижнем регистре
#   word  — лемма вместо re: формы разворачивает pymorphy3
#           («решимость» -> решимости/решимостью/...).
#           Без pymorphy3 ищет точное написание.
#   hint  — подсказка редактору, попадает в лог
#   fix   — автозамена; пусто — на месте вхождения остаётся пустота
#
# Правка словаря — вручную, любым редактором. е/ё различаются:
# где слово бывает с ё — пишите [её], например 'над[её]жн\w*'.
# Словарь стартовый — пополняется по мере работы над романом.
# ======================================================================
rules:
  # --- 1. Слово «решимость» и производные (памятка, п.1) ----------------
  - cat: решимость
    level: hard
    re: '\bрешимост\w*'
    hint: "Эмоция через действие: «Она смотрела в одну точку. Не мигала»"
  - cat: решимость
    level: hard
    re: '\bрешительн\w*'
    hint: "«Он шагнул вперёд. Молча» — действие вместо оценки"

  # --- 2. Взгляды-маркеры героизма --------------------------------------
  - cat: взгляд
    level: hard
    re: 'огонь в глазах'
    hint: "Маркер героизма. Показать поступок — или просто убрать"
  - cat: взгляд
    level: hard
    re: 'свет в глазах'
    hint: "Маркер героизма. Просто взгляд — или опустить"
  - cat: взгляд
    level: hard
    re: 'стальн\w* взгляд\w*'
    hint: "«Стальной взгляд» запрещён (памятка, п.1)"
  - cat: взгляд
    level: hard
    re: 'глазах горел\w*'
    hint: "Пафосный маркер: в глазах горит огонь/решимость"

  # --- 3. Вера и надежда в пафосном значении ----------------------------
  - cat: вера
    level: hard
    re: 'вер\w* в победу'
    hint: "«Вера в победу» — лозунг (вера/веру/верой в победу)"
  - cat: надежда
    level: soft
    word: надежда
    hint: "Пафос или быт? Решить вручную — автоматом не отличить"

  # --- 4. Назидательный вывод в конце сцены ------------------------------
  - cat: мораль
    level: soft
    re: 'понял\w*, что главн\w*'
    hint: "Назидательный вывод — оборвать сцену действием или паузой"
  - cat: мораль
    level: soft
    re: 'теперь (он|она) знал\w*'
    hint: "«Теперь он знал…» — вывод за читателя. Сцена кончается действием"

  # --- 5. Лозунги --------------------------------------------------------
  - cat: лозунг
    level: hard
    re: '\bмы (должны|обязаны) победить\b'
    hint: "Лозунг запрещён. «Мы ещё живы. Пока»"
  - cat: лозунг
    level: hard
    re: '\bмы (ещё )?победим\b'
    hint: "Лозунг. «Мы ещё живы. Пока»"
  - cat: лозунг
    level: hard
    re: '\bмы не отступим\b'
    hint: "Лозунг. Показать: не отступила — потому что не умела иначе"
  - cat: лозунг
    level: hard
    re: '\bмы не сдадимся\b'
    hint: "Лозунг того же ряда, что «мы не отступим»"

  # --- 6. Превозмогание ---------------------------------------------------
  - cat: превозмогание
    level: hard
    re: '\bпревозмог\w*'
    hint: "«Он выдохнул сквозь зубы. Встал» — физиология вместо пафоса"
  - cat: превозмогание
    level: soft
    re: 'стиснув зубы'
    hint: "Разрешено только как ирония — проверить контекст"
