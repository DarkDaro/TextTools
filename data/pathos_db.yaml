# ======================================================================
# АНТИПАФОС — пафосные штампы и обобщения (дополняет resolve_db.yaml).
# Те же поля и уровень жёсткости, что и в resolve_db.yaml (см. шапку там).
#
# Философия памятки: персонаж не «герой» — он выживает; эмоции через
# действие; физиология вместо «стального взгляда»; конкретика вместо
# оценок («город был мрачным» -> неон, дождь, гул трансформаторов).
# ======================================================================
rules:
  # --- Эпитеты героизма ---------------------------------------------------
  - cat: эпитет
    level: soft
    word: непоколебимый
    hint: "Формы ловит pymorphy3: непоколебимого/непоколебимым/…"
  - cat: эпитет
    level: soft
    word: несгибаемый
    hint: "Показать упрямство действием, а не ярлыком"
  - cat: эпитет
    level: soft
    re: 'железн\w* вол\w*'
    hint: "«Железная воля» — штамп. Что человек ДЕЛАЕТ вместо этого?"
  - cat: эпитет
    level: soft
    re: 'стальн\w* вол\w*'
    hint: "Штамп того же ряда"
  - cat: эпитет
    level: hard
    re: 'героическ\w*'
    hint: "В этом мире героев нет — персонаж просто делает, что может"
  - cat: эпитет
    level: soft
    re: 'самоотверженн\w*'
    hint: "Оценка вместо поступка"
  - cat: эпитет
    level: soft
    word: подвиг
    hint: "«Подвиг» — пафос. Показать цену поступка"
  - cat: эпитет
    level: soft
    re: 'бессмертн\w* подвиг\w*'
    hint: "Двойной пафос: и «бессмертный», и «подвиг»"

  # --- Пафосные конструкции ------------------------------------------------
  - cat: пафос
    level: hard
    re: 'с гордо поднятой головой'
    hint: "Штамп. Замена: «Поднял подбородок. Молча»"
  - cat: пафос
    level: soft
    re: 'во имя\b'
    hint: "«Во имя…» — лозунг или речь персонажа? Проверить"
  - cat: пафос
    level: soft
    re: 'не сломал\w*'
    hint: "«Он не сломался» — сказать сломом, а не сообщением"
  - cat: пафос
    level: soft
    re: 'остал\w* человеком'
    hint: "«Остался человеком» — вывод за читателя"
  - cat: пафос
    level: soft
    re: 'настоящ\w* геро[йияи]\w*'
    hint: "«Настоящий герой» — категоризация вместо сцены"
  - cat: пафос
    level: soft
    re: 'ради будущего'
    hint: "Пафосная мотивировка — конкретизировать"
  - cat: пафос
    level: soft
    re: 'цен\w* (этой |такой )?победы'
    hint: "«Цена победы» — риторическая конструкция"

  # --- Обобщения вместо конкретики (чек-лист памятки, п.4) -----------------
  - cat: обобщение
    level: soft
    re: '(город|мир|район|квартал) был\w* мрачн\w*'
    hint: "Конкретика: неон, дождь, гул трансформаторов"
  - cat: обобщение
    level: soft
    re: 'воздух был (густым|тяжёлым|тяжелым)'
    hint: "Клише атмосферы — заменить деталью"
  - cat: обобщение
    level: soft
    re: 'царил\w* (тишина|страх|хаос|порядок)'
    hint: "«Царила тишина» — штамп. Что слышно на самом деле?"
  - cat: обобщение
    level: soft
    re: 'атмосфер\w* (была|было) (гнетущей|мрачной|тяжёлой|тяжелой)'
    hint: "Оценка вместо декорации"
