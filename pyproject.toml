[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "textools"
dynamic = ["version"]
description = "Настольные инструменты для анализа и обработки текстов: реестр персонажей, Obsidian, чистка, замены"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "DarkDaro" }]
keywords = ["text", "markdown", "obsidian", "writing", "russian", "nlp"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Russian",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: General",
]
dependencies = [
    "PyYAML>=6.0",
    "python-docx>=1.1",
    "customtkinter>=5.2",
    "pymorphy3>=2.0",
    "charset-normalizer>=3.3",
    "tkinterdnd2>=0.4",
]

[project.urls]
Homepage = "https://github.com/DarkDaro/TextTools"
Repository = "https://github.com/DarkDaro/TextTools"
Issues = "https://github.com/DarkDaro/TextTools/issues"

[project.scripts]
textools = "textools:main"

[tool.setuptools]
py-modules = [
    "textools",
    "find_cjk",
    "gui_config",
    "gui_theme",
    "review_dialog",
    "widgets_ctk",
    "tabs_names",
    "tabs_vault",
    "tabs_clean",
    "tabs_replace",
    "tabs_settings",
]

[tool.setuptools.packages.find]
include = ["core*", "tools*", "wrappers*"]

[tool.setuptools.package-data]
tools = ["*.yaml"]

[tool.setuptools.dynamic]
version = { attr = "textools.__version__" }
