# 04.11: ruff 0.17 расширил дефолтный набор правил (UP, I, SIM, BLE, S, RUF…)
# — на неизменном коде это 260+ стилевых срабатываний. Селект закреплён на
# «ошибках и багах»: E9 — синтаксис, F — pyflakes (неопределённые и
# неиспользуемые имена). Расширение набора — отдельное решение.
[lint]
select = ["E9", "F"]

# archive/ — хранилище старых прогонов, в проверку кода не входит
[lint.extend-per-file-ignores]
"archive/*" = ["F"]
